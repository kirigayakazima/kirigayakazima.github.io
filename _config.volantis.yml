# Volantis 主题配置 —— 由 tools/gen-config.js 从旧站反推生成
# 默认值见 node_modules/hexo-theme-volantis/_config.yml
# 重新生成: npm run config
info:
  theme_name: Volantis
  theme_docs: https://volantis.js.org/
  theme_repo: https://github.com/volantis-x/hexo-theme-volantis
debug: false
default:
  avatar: volantis-static/media/placeholder/avatar/round/3442075.svg
  link: volantis-static/media/placeholder/link/8f277b4ee0ecd.svg
  cover: volantis-static/media/placeholder/cover/76b86c0226ffd.svg
  image: volantis-static/media/placeholder/image/2659360.svg
csp:
  enable: true
  content: " default-src 'self' https:; block-all-mixed-content; base-uri 'self' https:; form-action 'self' https:; worker-src 'self' https:; connect-src 'self' https: *; img-src 'self' data: https: *; media-src 'self' https: *; font-src 'self' data: https: *; frame-src 'self' https: *; manifest-src 'self' https: *; child-src https:; script-src 'self' https: 'unsafe-inline' *; style-src 'self' https: 'unsafe-inline' *; "
cdn:
  enable: false
  set:
    js:
      app: /js/app.js
    css:
      style: /css/style.css
cdn_version: true
volantis_static_cdn: https://unpkg.com/volantis-static@0.0.1654736714924/
replace:
  - https://cdn.jsdelivr.net/npm/ => https://unpkg.com/
  - https://cdn.jsdelivr.net/gh/ => https://fastly.jsdelivr.net/gh/
dns_prefetch:
  - https://unpkg.com
scroll_smooth: true
navbar:
  visiable: auto
  logo:
    img: https://gcore.jsdelivr.net/gh/volantis-x/cdn-org/blog/Logo-NavBar@3x.png
  menu:
    - name: 博客
      icon: fa-solid fa-rss
      url: /
    - name: 分类
      icon: fa-solid fa-folder-open
      url: categories/
    - name: 标签
      icon: fa-solid fa-tags
      url: tags/
    - name: 归档
      icon: fa-solid fa-archive
      url: archives/
    - name: 友链
      icon: fa-solid fa-link
      url: friends/
    - name: 关于
      icon: fa-solid fa-info-circle
      url: about/
  search: 搜内容
cover:
  height_scheme: full
  layout_scheme: search
  display:
    home: true
    archive: true
    others: false
  background: https://raw.githubusercontent.com/kiyoriyuna/Image/main/BlogImg202211261959533.jpg
  title: 玄儿的小世界
  subtitle: ""
  search: 搜内容
  features:
    - name: 文档
      url: /
    - name: 分类
      url: categories/
    - name: 标签
      url: tags/
    - name: 归档
      url: archives/
    - name: 友链
      url: friends/
    - name: 关于
      url: about/
pages:
  friends:
    layout_scheme: traditional
article:
  preview:
    scheme: landscape
    pin_icon: volantis-static/media/twemoji/assets/svg/1f4cc.svg
    auto_title: true
    auto_excerpt: true
    hide_excerpt: false
    line_style: solid
    author: false
    readmore: auto
  body:
    top_meta:
      - author
      - category
      - date
      - counter
    bottom_meta:
      - updated
      - tags
      - share
    footer_widget:
      references:
        title: 参考资料
        icon: fa-solid fa-quote-left
      related_posts:
        enable: false
        title: 相关文章
        icon: fa-solid fa-bookmark
        max_count: 5
        placeholder_img: https://uploadbeta.com/api/pictures/random/?key=BingEverydayWallpaperPicture
      copyright:
        enable: true
        permalink: 本文永久链接是：
        content:
          - 博客内容遵循 署名-非商业性使用-相同方式共享 4.0 国际 (CC BY-NC-SA 4.0) 协议
          - permalink
      donate:
        enable: false
        images:
          - volantis-static/media/org.volantis/blog/qrcode/github@volantis.png
          - volantis-static/media/org.volantis/blog/qrcode/github@volantis.png
    meta_library:
      author:
        avatar: volantis-static/media/org.volantis/blog/favicon/apple-touch-icon.png
        name: 请设置文章作者
        url: /
      date:
        icon: fa-solid fa-calendar-alt
        title: 发布于：
        format: ll
      updated:
        icon: fa-solid fa-edit
        title: 更新于：
        format: ll
      category:
        icon: fa-solid fa-folder-open
      counter:
        icon: fa-solid fa-eye
        unit: 次浏览
      walinecount:
        icon: fa-solid fa-comment-dots
        desc: 条评论
      artalkcount:
        icon: fa-solid fa-comment-dots
        desc: 条评论
      wordcount:
        icon_wordcount: fa-solid fa-keyboard
        icon_duration: fa-solid fa-hourglass-half
      tags:
        icon: fa-solid fa-hashtag
      share:
        - id: qq
          img: volantis-static/media/org.volantis/logo/128/qq.png
        - id: qzone
          img: volantis-static/media/org.volantis/logo/128/qzone.png
        - id: weibo
          img: volantis-static/media/org.volantis/logo/128/weibo.png
        - {}
        - {}
comments:
  title: <i class='fa-solid fa-comments'></i> 评论
  service: giscus
  artalk:
    js: https://yours-artalk-domain/dist/Artalk.js
    css: https://yours-artalk-domain/dist/Artalk.css
    server: https://yours-artalk-domain
    imgUploader: {}
  giscus:
    theme:
      light: light
      dark: dark
  beaudar:
    repo: xxx/xxx
    issue-term: pathname
    branch: main
    position: top
    order: desc
    theme:
      light: github-light
      dark: github-dark
    label: ✨💬✨
  utterances:
    repo: xxx/xxx
    issue-term: pathname
    theme:
      light: github-light
      dark: github-dark
    label: ✨💬✨
  disqus:
    autoload: false
  disqusjs:
    js: https://unpkg.com/disqusjs@1.3/dist/disqus.js
    css: https://unpkg.com/disqusjs@1.3/dist/disqusjs.css
  gitalk:
    js: https://unpkg.com/gitalk@1/dist/gitalk.min.js
  vssue:
    js: https://cdn.jsdelivr.net/gh/meteorlxy/vssue@1.4.4/packages/vssue/dist/vssue.github.min.js
    css: https://cdn.jsdelivr.net/gh/meteorlxy/vssue@1.4.4/packages/vssue/dist/vssue.min.css
    vue: https://cdn.jsdelivr.net/gh/vuejs/vue@2.6.11/dist/vue.runtime.min.js
  livere: {}
  isso:
    url: https://example.com/(path/)
    src: https://example.com/(path/)js/embed.min.js
  hashover:
    src: https://example.com/(path/)comments.php
  twikoo:
    js: https://unpkg.com/twikoo@latest
    envId: xxxxxxxxxxxxxxx
  waline:
    js: https://unpkg.com/@waline/client@v2/dist/waline.js
    css: https://unpkg.com/@waline/client@v2/dist/waline.css
    imageUploader: {}
    pageview: true
    comment: true
  discuss:
    js: https://cdn.jsdelivr.net/npm/discuss/dist/Discuss.js
sidebar:
  position: right
  for_page:
    - blogger
    - category
    - tagcloud
  for_post:
    - toc
  widget_library:
    blogger:
      class: blogger
      display:
        - desktop
        - mobile
      avatar: https://raw.githubusercontent.com/kiyoriyuna/Image/main/BlogImg202211262024354.jpg
      shape: rectangle
      url: /about/
      jinrishici: true
      social:
        - icon: fa-solid fa-envelope
          url: mailto:519033432@qq.com
        - icon: fab fa-github
          url: https://github.com/kirigayakazima
        - icon: fa-solid fa-headphones-alt
          url: https://music.163.com/#/user/home?id=551934240
    toc:
      class: toc
      display:
        - desktop
        - mobile
      header:
        icon: fa-solid fa-list
        title: 本文目录
      list_number: false
      min_depth: 2
      max_depth: 5
    music:
      class: music
      display:
        - desktop
        - mobile
      pjaxReload: false
    category:
      class: category
      display:
        - desktop
      header:
        icon: fa-solid fa-folder-open
        title: 文章分类
        url: /blog/categories/
    tagcloud:
      class: tagcloud
      display:
        - desktop
        - mobile
      header:
        icon: fa-solid fa-tags
        title: 热门标签
        url: /blog/tags/
      min_font: 14
      max_font: 24
      color: true
      start_color: "#999"
      end_color: "#555"
    qrcode:
      class: qrcode
      display:
        - desktop
        - mobile
      height: 64px
      images:
        - volantis-static/media/org.volantis/blog/qrcode/github@volantis.png
        - volantis-static/media/org.volantis/blog/qrcode/github@volantis.png
    webinfo:
      class: webinfo
      display:
        - desktop
      header:
        icon: fa-solid fa-award
        title: 站点信息
      type:
        article:
          enable: true
          text: 文章数目：
          unit: 篇
        runtime:
          enable: true
          data: 2022/11/26
          text: 已运行时间：
          unit: 天
        wordcount:
          enable: true
          text: 本站总字数：
          unit: 字
        visitcounter:
          siteuv:
            enable: true
            text: 本站访客数：
            unit: 人
          sitepv:
            enable: true
            text: 本站总访问量：
            unit: 次
        lastupd:
          enable: true
          friendlyShow: true
          text: 最后活动时间：
          unit: 日
    lastupdate:
      class: lastupdate
      display:
        - desktop
        - mobile
      header:
        icon: fa-solid fa-clock WISTERIA
        title: 最近更新
