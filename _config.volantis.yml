rightmenus:
  enable: true
  order:
    - plugins.navigation
    - hr
    - menus.darkMode
    - plugins.articlePage
    - music
  options:
    iconPrefix: fa-solid
    articleShowLink: true
    musicAlwaysShow: true
  plugins:
    navigation:
      - id: left
        name: 转到上一页
        icon: fa-solid fa-arrow-left
        event: history.back()
        group: navigation
      - id: right
        name: 转到下一页
        icon: fa-solid fa-arrow-right
        event: history.forward()
        group: navigation
      - id: redo
        name: 刷新当前页面
        icon: fa-solid fa-redo
        event: window.location.reload()
        group: navigation
      - id: up
        name: 回到顶部
        icon: fa-solid fa-arrow-up
        event: VolantisApp.scrolltoElement(volantis.dom.bodyAnchor)
        group: navigation
    inputBox:
      - id: copyPaste
        name: 粘贴文本
        icon: fa-solid fa-paste
        event: copyPaste
        group: inputBox
      - id: copyAll
        name: 全选文本
        icon: fa-solid fa-object-ungroup
        event: copyAll
        group: inputBox
      - id: copyCut
        name: 剪切文本
        icon: fa-solid fa-cut
        event: copyCut
        group: inputBox
    seletctText:
      - id: copyText
        name: 复制文本
        icon: fa-solid fa-copy
        event: copyText
        group: seletctText
      - id: searchWord
        name: 站内搜索
        icon: fa-solid fa-search
        event: OpenSearch(__text__)
        group: seletctText
      - id: bingSearch
        name: 必应搜索
        icon: fa-solid fa-search
        event: window.open(`https://cn.bing.com/search?q=${__text__}`)
        group: seletctText
    elementCheck:
      - id: openTab
        name: 新标签页打开
        icon: fa-solid fa-external-link-square-alt
        event: window.open(__link__)
        group: elementCheck
      - id: copyLink
        name: 复制链接地址
        icon: fa-solid fa-link
        event: copyLink
        group: elementCheck
    elementImage:
      - id: copyImg
        name: 复制图片
        icon: fa-solid fa-image
        event: copyImg
        group: elementImage
      - id: googleImg
        name: 谷歌识图
        icon: fa-solid fa-images
        event: window.open(`https://www.google.com.hk/searchbyimage?image_url=${__link__}`)
        group: elementImage
    articlePage:
      - id: printMode
        name: 打印页面
        icon: fa-solid fa-print
        event: printMode
        group: articlePage
      - id: readMode
        name: 阅读模式
        icon: fa-solid fa-book-open
        event: readMode
        group: articlePage
  menus:
    link:
      - id: help
        name: 常见问题
        icon: fa-solid fa-question
        link: https://volantis.js.org/faqs/
        group: link
      - id: examples
        name: 示例博客
        icon: fa-solid fa-rss
        link: https://volantis.js.org/examples/
        group: link
      - id: contributors
        name: 加入社区
        icon: fa-solid fa-fan
        link: https://volantis.js.org/contributors/
        group: link
      - hr
      - id: source_docs
        name: 本站源码
        icon: fa-solid fa-code-branch
        link: https://github.com/volantis-x/volantis-docs/
        group: link
      - id: source_theme
        name: 主题源码
        icon: fa-solid fa-code-branch
        link: https://github.com/volantis-x/hexo-theme-volantis/
        group: link
    darkMode:
      - id: darkMode
        name: 暗黑模式
        icon: fa-solid fa-moon
        event: volantis.dark.toggle()
        group: darkMode
