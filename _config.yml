# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html

# Site
title: 我的博客
subtitle: 个人博客、kirigayakazima - xuaner - 我的博客
description: 技术博客，分享嵌入式开发、数据结构、数字IC设计等技术内容
keywords: 嵌入式, 数字IC, 数据结构, 算法, FreeRTOS, Verilog
favicon: /images/favicon/favicon.ico
author: xuaner
language: zh-CN
timezone: Asia/Shanghai

# URL
url: https://kirigayakazima.github.io
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude files / folders
# exclude:
# ignore:
# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: volantis

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: git
  repo: https://github.com/kirigayakazima/kirigayakazima.github.io.git
  branch: main
  message: "Site updated: {{ now('YYYY-MM-DD HH:mm:ss') }}"

# Search
search:
  path: search.json
  field: all
  content: true

# Feed
feed:
  type: atom
  path: atom.xml
  limit: 20

# Markdown
marked:
  gfm: true
  pedantic: false
  breaks: true
  smartLists: true
  smartypants: true
  modifyAnchors: ''
  autolink: true

# Code Highlight
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false

prismjs:
  enable: false
  preprocess: true
  line_number: true
  mark: